# Template for the app secrets. DO NOT commit real values.
# Prefer creating it from the CLI so secrets never touch git:
#
#   kubectl create secret generic fpv-secrets \
#     --from-literal=ADMIN_KEY='choose-a-long-random-string' \
#     --from-file=GEE_SERVICE_ACCOUNT_JSON=./server/gee-service-account.json
#
# (The --from-file form reads the whole service-account JSON in as the value.)
#
# If you prefer a YAML file, fill in the values below and `kubectl apply -f` it,
# then delete the file. stringData takes plain (unencoded) strings.
apiVersion: v1
kind: Secret
metadata:
  name: fpv-secrets
type: Opaque
stringData:
  ADMIN_KEY: "REPLACE_WITH_A_LONG_RANDOM_STRING"
  # Paste the FULL Google Earth Engine service-account JSON here (as one block).
  GEE_SERVICE_ACCOUNT_JSON: |
    {
      "type": "service_account",
      "project_id": "REPLACE_ME"
    }
