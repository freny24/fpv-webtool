# Backend API (Node/Express + Google Earth Engine)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fpv-backend
  labels:
    app: fpv-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fpv-backend
  template:
    metadata:
      labels:
        app: fpv-backend
    spec:
      containers:
        - name: fpv-backend
          # TODO: replace with your registry path, e.g. registry.iu.edu/fpv/fpv-backend:1.0.0
          image: REGISTRY/fpv-backend:latest
          ports:
            - containerPort: 3001
          env:
            - name: DATA_DIR
              value: /app/persist
            - name: PORT
              value: "3001"
            # Secrets come from the fpv-secrets Secret (see secret.example.yaml)
            - name: GEE_SERVICE_ACCOUNT_JSON
              valueFrom:
                secretKeyRef:
                  name: fpv-secrets
                  key: GEE_SERVICE_ACCOUNT_JSON
            - name: ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: fpv-secrets
                  key: ADMIN_KEY
            # Same-origin via nginx proxy means CORS isn't triggered; leave empty
            # unless you also expose the API on its own hostname.
            - name: ALLOWED_ORIGINS
              value: ""
          volumeMounts:
            - name: fpv-data
              mountPath: /app/persist
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: fpv-data
          persistentVolumeClaim:
            claimName: fpv-data
---
apiVersion: v1
kind: Service
metadata:
  name: fpv-backend
  labels:
    app: fpv-backend
spec:
  type: ClusterIP # internal only; reached by the frontend's nginx proxy
  selector:
    app: fpv-backend
  ports:
    - port: 3001
      targetPort: 3001
