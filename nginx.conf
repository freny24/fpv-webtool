server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # gzip static assets
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Single-page app: serve index.html for any non-file route
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Forward API calls to the backend service (same origin -> no CORS needed).
  # "fpv-backend" is the Kubernetes Service name; 3001 is the API port.
  location /api/ {
    proxy_pass http://fpv-backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Earth Engine calls can take a while
    proxy_connect_timeout 30s;
    proxy_read_timeout 180s;
  }
}
